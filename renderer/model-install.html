<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>Installing open-source STT model</title>
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --line: #e4e1d8;
      --fg: #1a1a1a;
      --muted: #6e6d68;
      --soft: #f0eee8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 26px;
    }
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 2px 10px rgba(26, 26, 26, 0.05);
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Palatino Linotype", serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--fg);
    }
    .sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .track {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: var(--fg);
      border-radius: 999px;
      transition: width 0.12s ease;
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }
    .meta .pct {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <h1>Installing open-source STT model</h1>
      <p class="sub" id="status-sub">Downloading Parakeet v3 for local speech recognition...</p>
    </div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="fill" id="bar-fill"></div>
    </div>
    <div class="meta">
      <span id="mb-text">0.0 MB / 639.4 MB</span>
      <span class="pct" id="pct-text">0%</span>
    </div>
  </div>
  <script>
    const fill = document.getElementById("bar-fill");
    const mbText = document.getElementById("mb-text");
    const pctText = document.getElementById("pct-text");
    const sub = document.getElementById("status-sub");
    if (window.openflow) {
      window.openflow.on("model-install-progress", (data) => {
        if (!data) return;
        if (data.error) {
          sub.textContent = data.error;
          return;
        }
        const pct = Math.max(0, Math.min(100, Number(data.percent) || 0));
        const down = Number(data.downloadedMb || 0).toFixed(1);
        const total = Number(data.totalMb || 639.4).toFixed(1);
        fill.style.width = pct + "%";
        mbText.textContent = down + " MB / " + total + " MB";
        pctText.textContent = pct + "%";
      });
    }
  </script>
</body>
</html>
