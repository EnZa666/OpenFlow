<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2.4"></circle>
          <circle cx="16" cy="16" r="2.8" fill="currentColor"></circle>
        </svg>
        <span>OpenFlow</span>
      </div>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <span class="shortcut-pill"><kbd>Ctrl</kbd> + <kbd>Win</kbd></span>
      </div>
    </aside>
    <main>
      <div class="view-head">
        <h1 id="title"></h1>
      </div>
      <section id="view"></section>
      <div id="editor" hidden></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
