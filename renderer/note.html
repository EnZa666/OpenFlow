<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Note</title>
  <style>
    :root {
      --sand-50: #fcfcfb;
      --sand-500: #f5f4f0;
      --sand-600: #eeebe3;
      --vast-600: #71716e;
      --vast-950: #1a1a1a;
      --green-600: #059669;
      --green-50: #ecfdf5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      color: var(--vast-950);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { padding: 14px; }
    .card {
      height: 100%;
      background: var(--sand-50);
      border: 1px solid var(--sand-600);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(26, 26, 26, 0.18), 0 4px 12px rgba(26, 26, 26, 0.08);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--sand-600);
      background: var(--sand-500);
      -webkit-app-region: drag;
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid var(--sand-600);
      background: var(--sand-50);
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      -webkit-app-region: no-drag;
    }
    button { cursor: pointer; }
    #title {
      flex: 1;
      min-width: 0;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--vast-950);
      padding: 4px 8px;
      border-radius: 8px;
      outline: none;
      transition: background-color .14s ease;
    }
    #title:hover, #title:focus {
      background: #ffffff;
    }
    .icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: var(--vast-950);
      font-size: 17px;
      transition: background-color .14s ease;
    }
    .icon:hover { background: var(--sand-600); }
    textarea {
      resize: none;
      width: 100%;
      height: 100%;
      padding: 16px 18px;
      outline: none;
      font-size: 14.5px;
      line-height: 1.6;
      background: #ffffff;
      color: var(--vast-950);
    }
    textarea::placeholder { color: var(--vast-600); }
    #save, #copy {
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      transition: all .15s ease;
    }
    #save {
      background: var(--vast-950);
      color: var(--sand-50);
      border: 1px solid var(--vast-950);
      box-shadow: 0 1px 2px rgba(26, 26, 26, 0.12);
    }
    #save:hover:not(:disabled) { opacity: 0.92; transform: translateY(-0.5px); }
    #save.saved { background: var(--green-50); color: var(--green-600); border-color: var(--green-600); }
    #copy {
      color: var(--vast-950);
      background: var(--sand-500);
      border: 1px solid var(--sand-600);
    }
    #copy:hover { background: var(--sand-600); }
    #copy.copied { background: var(--green-50); color: var(--green-600); border-color: var(--green-600); }
    #voice {
      margin-right: auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 14px 7px 11px;
      border-radius: 999px;
      background: #0a0a0a;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: .01em;
      border: 1px solid #0a0a0a;
      transition: background-color .15s ease, opacity .15s ease;
    }
    #voice:hover:not(:disabled) { background: #222; }
    #voice:disabled { cursor: default; opacity: .75; }
    #voice .dot { position: relative; width: 9px; height: 9px; border-radius: 50%; background: #ef4444; flex: 0 0 9px; }
    #voice .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #ef4444; animation: vpulse 1.3s ease-out infinite; }
    #voice .stop { display: none; width: 8px; height: 8px; border-radius: 2px; background: #fff; }
    #voice:hover:not(:disabled) .dot { display: none; }
    #voice:hover:not(:disabled) .stop { display: block; }
    #voice.busy .dot { background: transparent; border: 1.5px solid rgba(255,255,255,.3); border-top-color: #fff; box-sizing: border-box; animation: vspin .7s linear infinite; }
    #voice.busy .dot::after { display: none; }
    @keyframes vpulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes vspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #voice .dot::after { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <input id="title" value="Note" placeholder="Note title" aria-label="Title">
      <button id="close" class="icon" type="button" aria-label="Close" title="Close">×</button>
    </header>
    <textarea id="body" placeholder="Write or dictate a note..."></textarea>
    <footer>
      <button id="voice" type="button" hidden title="Stop recording"><span class="dot"></span><span class="stop"></span><span id="voice-label">Voice active</span></button>
      <button id="copy" type="button">Copy</button>
      <button id="save" type="button">Save</button>
    </footer>
  </div>
  <script>
    let currentNote = { id: "", title: "Note", content: "" };
    const voiceButton = document.querySelector("#voice");
    const voiceLabel = document.querySelector("#voice-label");
    const bodyField = document.querySelector("#body");
    const idlePlaceholder = bodyField.placeholder;
    let voiceState = "off";
    let voiceWaiters = [];

    function setVoiceState(next) {
      voiceState = next;
      voiceButton.hidden = next === "off";
      voiceButton.disabled = next === "busy";
      voiceButton.classList.toggle("busy", next === "busy");
      voiceLabel.textContent = next === "busy" ? "Transcribing..." : "Voice active";
      voiceButton.title = next === "active" ? "Stop recording" : "";
      bodyField.placeholder = next === "active" ? "Listening..." : idlePlaceholder;
      if (next === "off") {
        const waiters = voiceWaiters;
        voiceWaiters = [];
        waiters.forEach((resolve) => resolve());
      }
    }

    function appendVoice(text) {
      const clean = String(text || "").trim();
      if (!clean) return;
      const current = bodyField.value;
      const gap = current && !/\s$/.test(current) ? " " : "";
      bodyField.value = current + gap + clean;
      bodyField.scrollTop = bodyField.scrollHeight;
      if (document.activeElement === bodyField) {
        bodyField.selectionStart = bodyField.selectionEnd = bodyField.value.length;
      }
    }

    function onVoice(message) {
      if (!message) return;
      if (message.type === "start") setVoiceState("active");
      if (message.type === "text") appendVoice(message.text);
      if (message.type === "stopped" && voiceState === "active") setVoiceState("busy");
      if (message.type === "done") setVoiceState("off");
    }

    // Stop a running voice note and wait until its last words have landed in the pad.
    function finishVoice() {
      if (voiceState === "off" || !window.openflow) return Promise.resolve();
      const done = new Promise((resolve) => {
        voiceWaiters.push(resolve);
        setTimeout(resolve, 20000);
      });
      if (voiceState === "active") window.openflow.dispatch("voicenote.stop").catch(() => {});
      return done;
    }

    voiceButton.addEventListener("click", () => {
      if (voiceState === "active" && window.openflow) window.openflow.dispatch("voicenote.stop").catch(() => {});
    });

    async function onShow(data) {
      const wantedId = data && data.id ? String(data.id) : "";
      if (wantedId && window.openflow) {
        const pads = await window.openflow.dispatch("pads.list");
        const found = (pads || []).find((p) => p.id === wantedId);
        if (found) {
          currentNote = { id: found.id, title: found.title || "Note", content: found.content || "" };
        } else {
          currentNote = { id: "", title: "Note", content: "" };
        }
      } else {
        currentNote = { id: "", title: "Note", content: "" };
      }
      document.querySelector("#title").value = currentNote.title;
      document.querySelector("#body").value = currentNote.content;
      document.querySelector("#body").focus();
    }

    document.querySelector("#close").addEventListener("click", () => {
      if (window.openflow) window.openflow.dispatch("note.close");
    });

    document.querySelector("#copy").addEventListener("click", async () => {
      if (!window.openflow) return;
      const btn = document.querySelector("#copy");
      await window.openflow.dispatch("clipboard.copy", { text: document.querySelector("#body").value });
      btn.textContent = "Copied ✓";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "Copy";
        btn.classList.remove("copied");
      }, 1000);
    });

    document.querySelector("#save").addEventListener("click", async () => {
      if (!window.openflow) return;
      const titleInput = document.querySelector("#title");
      const bodyInput = document.querySelector("#body");
      const nextTitle = titleInput && titleInput.value.trim() ? titleInput.value.trim() : "Note";
      const button = document.querySelector("#save");
      button.disabled = true;
      await finishVoice();
      const nextContent = bodyInput ? bodyInput.value : "";
      button.textContent = "Saved ✓";
      button.classList.add("saved");
      const saved = await window.openflow.dispatch("pads.save", {
        id: currentNote.id || undefined,
        title: nextTitle,
        content: nextContent,
      });
      currentNote.id = saved.id;
      await new Promise((resolve) => setTimeout(resolve, 500));
      button.disabled = false;
      button.textContent = "Save";
      button.classList.remove("saved");
      await window.openflow.dispatch("note.close");
    });

    if (window.openflow) {
      window.openflow.on("note-show", onShow);
      window.openflow.on("note-voice", onVoice);
      onShow({});
    }
  </script>
</body>
</html>
