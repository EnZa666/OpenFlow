<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../renderer/styles.css">
  <style>
    html, body { width: 980px; height: 540px; overflow: hidden; }
    .app { height: 540px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <nav aria-label="Sections">
        <button type="button" data-nav="dictation"><svg viewBox="0 0 16 16"><rect x="6" y="1.5" width="4" height="7.5" rx="2"></rect><path d="M4 8a4 4 0 0 0 8 0M8 12v2"></path></svg>Dictation</button>
        <button type="button" data-nav="notes"><svg viewBox="0 0 16 16"><path d="M4 2.5h5.5L12 5v8.5H4z"></path><path d="M9.2 2.6V5.2H12"></path></svg>Notes</button>
        <button type="button" data-nav="usage" aria-current="page"><svg viewBox="0 0 16 16"><path d="M3 12.5V9M6.5 12.5V6.5M10 12.5V4M13.5 12.5V8"></path></svg>Usage</button>
        <button type="button" data-nav="settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.1"></circle><path d="M8 2.2v1.5M8 12.3v1.5M2.2 8h1.5M12.3 8h1.5M3.9 3.9l1.1 1.1M11 11l1.1 1.1M12.1 3.9 11 5M5 11l-1.1 1.1"></path></svg>Settings</button>
      </nav>
    </aside>
    <main>
      <div class="view-head">
        <h1>Usage</h1>
      </div>
      <section id="view">
        <div class="stats">
          <article class="stat">
            <b>42.8 min</b>
            <span>Audio, 128 dictations</span>

            <b>$0.19</b>

          </article>
          <article class="stat">
            <b>6,420</b>
            <span>Spoken words</span>
          </article>
        </div>
        <div class="chart-card">
          <div class="chart" role="img" aria-label="Usage over the last 30 days">
            <i style="height:18%"></i>
            <i style="height:32%"></i>
            <i style="height:14%"></i>
            <i style="height:45%"></i>
            <i style="height:52%"></i>

            <i style="height:10%"></i>
            <i style="height:38%"></i>

            <i style="height:12%"></i>
            <i style="height:60%"></i>
            <i style="height:78%"></i>
            <i style="height:44%"></i>
            <i style="height:68%"></i>
            <i style="height:84%"></i>
            <i style="height:35%"></i>
            <i style="height:16%"></i>
            <i style="height:58%"></i>
            <i style="height:92%"></i>
            <i style="height:74%"></i>
            <i style="height:66%"></i>
            <i style="height:88%"></i>
            <i style="height:42%"></i>
            <i style="height:28%"></i>
            <i style="height:96%"></i>
            <i style="height:100%"></i>
          </div>
          <div class="axis">
            <span>Sep 23</span>
            <span>Oct 22</span>
          </div>
        </div>
        <p class="note">Estimated at list price: $0.0045 USD per minute (gpt-transcribe). Local Parakeet v3 dictations are free ($0.00).</p>
      </section>
    </main>
  </div>
</body>
</html>
