<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../renderer/styles.css">
  <style>
    html, body { width: 980px; height: 540px; overflow: hidden; }
    .app { height: 540px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2.4"></circle>
          <circle cx="16" cy="16" r="2.8" fill="currentColor"></circle>
        </svg>
        <span>OpenFlow</span>
      </div>
      <nav aria-label="Sections">
        <button type="button"><svg viewBox="0 0 16 16"><rect x="6" y="1.5" width="4" height="7.5" rx="2"></rect><path d="M4 8a4 4 0 0 0 8 0M8 12v2"></path></svg>Dictation</button>
        <button type="button" aria-current="page"><svg viewBox="0 0 16 16"><path d="M4 2.5h5.5L12 5v8.5H4z"></path><path d="M9.2 2.6V5.2H12"></path></svg>Notes</button>
        <button type="button"><svg viewBox="0 0 16 16"><path d="M3 12.5V9M6.5 12.5V6.5M10 12.5V4M13.5 12.5V8"></path></svg>Usage</button>
        <button type="button"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.1"></circle><path d="M8 2.2v1.5M8 12.3v1.5M2.2 8h1.5M12.3 8h1.5M3.9 3.9l1.1 1.1M11 11l1.1 1.1M12.1 3.9 11 5M5 11l-1.1 1.1"></path></svg>Settings</button>
      </nav>
      <div class="sidebar-foot">
        <span class="shortcut-pill"><kbd>Ctrl</kbd> + <kbd>Win</kbd></span>
      </div>
    </aside>
    <main>
      <div class="view-head">
        <h1>Notes</h1>
      </div>
      <section id="view">
        <div class="notes-toolbar">
          <button type="button" class="text-button">+ New Note</button>
        </div>
        <div class="note-tabs" role="tablist">
          <div class="note-tab-wrap" aria-selected="true"><button type="button" class="note-tab" aria-selected="true">Sprint Architecture Notes</button><button type="button" data-pad-delete="1">×</button></div>
          <div class="note-tab-wrap" aria-selected="false"><button type="button" class="note-tab" aria-selected="false">Voice Transcript</button><button type="button" data-pad-delete="2">×</button></div>
          <div class="note-tab-wrap" aria-selected="false"><button type="button" class="note-tab" aria-selected="false">Release Checklist</button><button type="button" data-pad-delete="3">×</button></div>
        </div>
      </section>
      <div id="editor" style="margin-top: 16px;">
        <div class="editor-bar">
          <button type="button" id="editor-back">Close</button>
          <div class="editor-actions">
            <span class="save-badge visible">Saved ✓</span>
            <button type="button" id="editor-save" class="saved">Saved ✓</button>
          </div>
        </div>
        <input id="editor-title" value="Sprint Architecture Notes" aria-label="Title">
        <textarea id="editor-body" aria-label="Note">Spoken dictation automatically opens its note tab when no input field is focused on screen. Every note tab shares an equal width, and clicking Save confirms with instant visual feedback.</textarea>
      </div>
    </main>
  </div>
</body>
</html>
